<script>
/* The service worker: installable, offline-capable. Registered last so a SW bug
   can never stop the app booting; scope is this directory.

   REGISTERED WITH THE BUILD ID ON IT, and that is not decoration. A browser
   only installs a new worker when the worker's SCRIPT changes, and sw.js is
   the one file a deploy never edits — so the worker that shipped months ago
   kept running, kept its old core cache name, and kept answering with the
   build it was born with. A child who had ever opened the app was pinned to
   that build: new index.html on the server, old app in the browser, and no
   number of reloads fixed it. The stamp in the URL makes every deploy a new
   worker.

   And when the new one takes over, the page it takes over is still running
   the old code — so reload it, exactly once. */
if ('serviceWorker' in navigator) {
  addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js?v=' + (self.IND_BUILD || 'dev')).catch(function () {});
  });
  /* read BEFORE the listener: the first install claims the page too, and
     reloading on a first visit is a flicker for no reason */
  var swWasControlled = !!navigator.serviceWorker.controller, swReloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (swReloaded || !swWasControlled) return;
    swReloaded = true;
    location.reload();
  });
}
</script>
